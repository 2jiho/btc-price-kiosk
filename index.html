<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://cdn.jsdelivr.net wss://api.upbit.com wss://stream.binance.com:443; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cdn.jsdelivr.net data:; manifest-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="icon"
      href="./bitcoin-btc-logo.svg"
      type="image/svg+xml"
    />
    <title>비트코인 실시간 가격</title>
    <style>
      * {
        -webkit-user-select: none;
        user-select: none;
      }
      input, button {
        -webkit-user-select: text;
        user-select: text;
      }
      :root {
        --reference-size: calc(min(1vw, 2vh));
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: #000;
        color: #ffffff;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #container {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
      }
      #icon {
        height: calc(var(--reference-size) * 15);
        margin-right: calc(var(--reference-size) * 5);
      }
      #price-main {
        margin: 0;
        font-size: calc(var(--reference-size) * 5);
        margin-right: calc(var(--reference-size) * 5);
      }
      #price-source {
        color: #aaa;
        margin: 0;
        font-size: calc(var(--reference-size) * 2);
        margin-right: calc(var(--reference-size) * 5);
      }
      #change {
        margin: 0;
        font-size: calc(var(--reference-size) * 3);
      }
      #change-label {
        margin: 0;
        font-size: calc(var(--reference-size) * 2);
        color: gray;
      }
      #status-indicator {
        position: fixed;
        top: 8px;
        right: 12px;
        font-size: 12px;
        color: #666;
        opacity: 0.6;
        transition: opacity 0.3s;
        cursor: pointer;
        user-select: none;
      }
      #status-indicator.error {
        color: #ff6b6b;
        opacity: 1;
      }
      #status-indicator.connected {
        color: #51cf66;
      }

      #status-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.7);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        backdrop-filter: blur(5px);
        transition: opacity 0.5s ease;
      }
      #status-overlay h1 {
        color: #ff6b6b;
        font-size: calc(var(--reference-size) * 8);
        margin-bottom: 20px;
        user-select: none;
      }
      #status-overlay p {
        white-space: pre-line;
        color: #fff;
        font-size: calc(var(--reference-size) * 4);
        user-select: none;
      }
      #admin-panel {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #1a1a1a;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 24px;
        display: none;
        flex-direction: column;
        gap: 12px;
        z-index: 2000;
        min-width: 320px;
      }
      #admin-panel h2 {
        margin: 0 0 4px 0;
        color: #fff;
        font-size: 16px;
        text-align: center;
      }
      #admin-panel label {
        color: #ccc;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #admin-panel label input[type="text"],
      #admin-panel label input[type="number"] {
        width: 120px;
      }
      .brightness-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #admin-panel label input[type="text"],
      #admin-panel label input[type="number"] {
        width: 120px;
      }
      #brightness-value {
        font-size: 13px;
        color: #aaa;
        display: inline-block;
        width: 32px;
        text-align: right;
      }
      .brightness-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
      }
      .brightness-row input[type="range"] {
        flex: 1;
      }
      #icon-fallback {
        display: none;
        height: calc(var(--reference-size) * 15);
        width: calc(var(--reference-size) * 15);
        justify-content: center;
        align-items: center;
        font-size: calc(var(--reference-size) * 4);
        font-weight: bold;
        color: #fff;
        background: #333;
        border-radius: 50%;
        margin-right: calc(var(--reference-size) * 5);
      }
      /* Toast notification for admin UX */
      #toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #333;
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 3000;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #toast.show { opacity: 1; }
      #wake-lock-panel {
        position: fixed;
        bottom: max(8px, env(safe-area-inset-bottom));
        left: 12px;
        right: 12px;
        color: #aaa;
        font-size: 12px;
        z-index: 1500;
      }
      #wake-lock-panel button {
        min-height: 44px;
        margin: 4px;
        padding: 6px 12px;
        background: #222;
        color: #fff;
        border: 1px solid #888;
        border-radius: 6px;
      }
      #currency-controls {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        left: 12px;
        display: flex;
        gap: 6px;
        z-index: 1500;
      }
      #currency-controls button, #market-retry {
        background: #111;
        color: #bbb;
        border: 1px solid #555;
        border-radius: 6px;
        min-height: 44px;
        padding: 6px 12px;
      }
      #currency-controls button[aria-pressed="true"] { color: #fff; border-color: #f7931a; }
      .admin-note { color: #aaa; font-size: 12px; }
      #admin-panel { min-width: 0; width: min(320px, calc(100vw - 64px)); }
      #status-indicator { z-index: 1500; max-width: 45vw; }
      @media (max-width: 600px) {
        #status-indicator { top: 62px; max-width: calc(100vw - 24px); }
        #currency-controls { left: 8px; }
      }
      button:focus-visible, #status-indicator:focus-visible { outline: 2px solid #fff; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="admin-panel" role="dialog" aria-modal="true" aria-labelledby="admin-title">
      <h2 id="admin-title">관리자 설정</h2>
      <label>
        코인 티커
        <input type="text" id="admin-symbol" value="BTC" placeholder="BTC" />
      </label>
      <p class="admin-note">공개 WebSocket 실시간 시세 · 선택한 거래소만 연결</p>
      <label>
        디버그 모드
        <input type="checkbox" id="admin-debug" />
      </label>
      <label>
        화면 밝기
        <div class="brightness-row">
          <input type="range" id="admin-brightness" min="10" max="100" value="100" step="5" />
          <span id="brightness-value">100%</span>
        </div>
      </label>
      <button id="admin-save">저장 및 적용</button>
      <button id="admin-close">닫기</button>
    </div>
    <div id="currency-controls" role="group" aria-label="표시 통화 및 거래소 선택">
      <button type="button" data-currency="KRW" aria-pressed="true">원화 · 업비트</button>
      <button type="button" data-currency="USDT" aria-pressed="false">USDT · 바이낸스</button>
    </div>
    <div id="toast" role="status"></div>
    <div id="wake-lock-panel">
      <span id="wake-lock-status" role="status" aria-live="polite"></span>
      <button id="wake-lock-retry" type="button" hidden>화면 켜짐 유지 다시 시도</button>
      <button id="app-update" type="button" hidden>새 버전 적용 (새로고침)</button>
    </div>
    <div id="status-indicator" role="button" tabindex="0" aria-label="관리자 설정 열기" aria-live="polite"></div>
    <div id="status-overlay">
      <h1 id="overlay-title">새 시세 대기</h1>
      <p id="overlay-msg">시세 수신을 기다립니다.</p>
      <button id="market-retry" type="button" hidden>시세 다시 연결</button>
    </div>
    <div id="container">
      <img src="./bitcoin-btc-logo.svg" id="icon" alt="Bitcoin logo" />
      <div id="icon-fallback"></div>
      <div>
        <p id="price-main" aria-live="polite" aria-atomic="true"></p>
        <p id="price-source"></p>
      </div>
      <div>
        <p id="change" aria-live="polite" aria-atomic="true"></p>
        <p id="change-label">24h</p>
      </div>
    </div>

    <script src="./wake-lock.js" defer></script>
    <script src="./market-data.js"></script>
    <script>
      (function () {
        "use strict";
        var settings = { ticker: "BTC", currency: "KRW", debug: false, brightness: 100 };
        var elPrice = document.getElementById("price-main");
        var elSource = document.getElementById("price-source");
        var elChange = document.getElementById("change");
        var elChangeLabel = document.getElementById("change-label");
        var elContainer = document.getElementById("container");
        var elStatus = document.getElementById("status-indicator");
        var elOverlay = document.getElementById("status-overlay");
        var elOverlayTitle = document.getElementById("overlay-title");
        var elOverlayMsg = document.getElementById("overlay-msg");
        var elRetry = document.getElementById("market-retry");
        var elAdminPanel = document.getElementById("admin-panel");
        var elAdminSymbol = document.getElementById("admin-symbol");
        var elAdminDebug = document.getElementById("admin-debug");
        var elAdminBrightness = document.getElementById("admin-brightness");
        var elBrightnessValue = document.getElementById("brightness-value");
        var elIcon = document.getElementById("icon");
        var elIconFallback = document.getElementById("icon-fallback");
        var controls = document.querySelectorAll("[data-currency]");
        var formatKRW = new Intl.NumberFormat("ko-KR", { style: "currency", currency: "KRW", maximumFractionDigits: 0 });
        var formatUSDT = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        var state = null, lastRendered = null, animationTimer = null, toastTimer = null;
        var cursorTimer = null, statusTimer = null, burninTimer = null, offsetX = 0, offsetY = 0;
        var adminReturnFocus = null;

        function formatPrice(tick) {
          return tick.selection.currency === "KRW" ? formatKRW.format(tick.price) : formatUSDT.format(tick.price) + " USDT";
        }
        function showToast(message) {
          var toast = document.getElementById("toast");
          toast.textContent = message; toast.className = "show";
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toast.className = ""; }, 2000);
        }
        function persist() {
          try { localStorage.setItem("btc-kiosk-settings", JSON.stringify(settings)); return true; }
          catch (error) { showToast("설정을 저장하지 못했습니다. 이번 실행에만 적용됩니다."); return false; }
        }
        function loadSettings() {
          try {
            var saved = JSON.parse(localStorage.getItem("btc-kiosk-settings"));
            if (saved && typeof saved === "object") {
              if (typeof saved.ticker === "string" && /^[A-Z0-9]{1,20}$/.test(saved.ticker.toUpperCase())) settings.ticker = saved.ticker.toUpperCase();
              if (["KRW", "USDT"].includes(saved.currency)) settings.currency = saved.currency;
              settings.debug = saved.debug === true;
              var brightness = Number(saved.brightness);
              if (Number.isFinite(brightness) && brightness >= 10 && brightness <= 100) settings.brightness = brightness;
            }
            // Remove the obsolete converted-rate storage from previous installations.
            localStorage.removeItem("btc-last-exchange-rate");
          } catch (error) { console.warn("설정 불러오기 실패:", error); }
        }
        function updateIcon() {
          var ticker = settings.ticker;
          elIcon.alt = ticker + " logo";
          elIcon.onload = function () { elIcon.style.display = "block"; elIconFallback.style.display = "none"; };
          elIcon.onerror = function () {
            elIcon.style.display = "none"; elIconFallback.textContent = settings.ticker; elIconFallback.style.display = "flex";
          };
          elIcon.src = ticker === "BTC" ? "./bitcoin-btc-logo.svg" :
            "https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/svg/color/" + ticker.toLowerCase() + ".svg";
        }
        function renderTick(tick) {
          if (tick.selection.currency !== settings.currency || tick.selection.ticker !== settings.ticker) return;
          var formatted = formatPrice(tick);
          if (elPrice.textContent !== formatted) elPrice.textContent = formatted;
          var change = (tick.change >= 0 ? "+" : "") + tick.change.toFixed(2) + "%";
          if (elChange.textContent !== change) elChange.textContent = change;
          elChange.style.color = tick.change > 0 ? "lightgreen" : tick.change < 0 ? "lightcoral" : "white";
          if (lastRendered && lastRendered.price !== tick.price) {
            elPrice.style.color = tick.price > lastRendered.price ? "lightgreen" : "lightcoral";
            clearTimeout(animationTimer);
            animationTimer = setTimeout(function () { elPrice.style.color = "white"; }, 500);
          }
          lastRendered = tick;
        }
        function renderState(next) {
          if (next) state = next;
          if (!state || !state.selection) return;
          var kind = state.kind, label;
          switch (kind) {
            case "live": label = "실시간 연결됨"; break;
            case "connecting": label = "연결 중…"; break;
            case "waiting": label = "새 시세 수신 대기…"; break;
            case "paused": label = "백그라운드 대기"; break;
            case "offline": label = "오프라인"; break;
            case "error": label = state.reason; break;
            default:
              label = state.reason + " · 재연결 " + Math.max(0, Math.ceil((state.retryAt - Date.now()) / 1000)) + "초 후";
          }
          var text = state.selection.exchange + " · " + label;
          if (elStatus.textContent !== text) elStatus.textContent = text;
          elStatus.className = kind === "live" ? "connected" : kind === "connecting" || kind === "waiting" ? "" : "error";
          var problem = ["backoff", "error", "offline"].includes(kind);
          elOverlay.style.display = problem || (kind !== "live" && !!state.last) ? "flex" : "none";
          elOverlayTitle.textContent = kind === "error" ? "시세 오류" : kind === "offline" ? "오프라인" : "새 시세 대기";
          var detail = state.last ? "마지막 시세: " + formatPrice(state.last) + " · " +
            Math.max(0, Math.floor((Date.now() - Math.min(state.last.receivedAt, state.last.eventTime)) / 1000)) + "초 전" : "아직 수신한 시세가 없습니다.";
          elOverlayMsg.textContent = detail + (state.reason ? "\n" + state.reason : "");
          elRetry.hidden = kind !== "error";
        }
        function applySelection() {
          // Clear the old amount before relabeling or initiating another source.
          clearTimeout(animationTimer); animationTimer = null; lastRendered = null;
          elPrice.textContent = "—"; elPrice.style.color = "white";
          elChange.textContent = "—"; elChange.style.color = "white";
          elSource.textContent = settings.currency === "KRW" ? "업비트 · KRW-" + settings.ticker : "바이낸스 · " + settings.ticker + "/USDT";
          elChangeLabel.textContent = settings.currency === "KRW" ? "전일 대비" : "24h";
          controls.forEach(function (control) { control.setAttribute("aria-pressed", String(control.dataset.currency === settings.currency)); });
          updateIcon();
          feed.select(settings.currency, settings.ticker);
        }
        function pauseVisualTimers() {
          clearInterval(statusTimer); clearInterval(burninTimer);
          statusTimer = burninTimer = null;
        }
        function resumeVisualTimers() {
          if (statusTimer !== null) return;
          statusTimer = setInterval(function () { if (state && state.kind !== "live") renderState(); }, 1000);
          burninTimer = setInterval(function () {
            var limitX = Math.max(0, Math.floor((window.innerWidth - elContainer.offsetWidth) * 0.05));
            var limitY = Math.max(0, Math.floor((window.innerHeight - elContainer.offsetHeight) * 0.05));
            offsetX = Math.max(-limitX, Math.min(limitX, offsetX + (Math.random() < 0.5 ? 10 : -10)));
            offsetY = Math.max(-limitY, Math.min(limitY, offsetY + (Math.random() < 0.5 ? 10 : -10)));
            elContainer.style.transform = "translate(" + offsetX + "px, " + offsetY + "px)";
          }, 60000);
        }
        function setVisible(visible) {
          feed.setActive(visible);
          if (visible) resumeVisualTimers(); else pauseVisualTimers();
        }
        loadSettings();
        elContainer.style.setProperty("filter", "brightness(" + settings.brightness + "%)");
        var feed = window.createMarketFeed({
          active: document.visibilityState === "visible", online: navigator.onLine,
          onTick: renderTick, onState: renderState,
          onError: function (error) { if (settings.debug) console.warn("시세 메시지 오류:", error); },
        });
        applySelection();
        if (document.visibilityState === "visible") resumeVisualTimers();
        controls.forEach(function (control) {
          control.addEventListener("click", function () {
            if (settings.currency === control.dataset.currency) return;
            settings.currency = control.dataset.currency;
            persist(); applySelection();
          });
        });
        elRetry.addEventListener("click", function () { feed.retry(); });
        document.addEventListener("visibilitychange", function () { setVisible(document.visibilityState === "visible"); });
        window.addEventListener("pagehide", function () { setVisible(false); });
        window.addEventListener("pageshow", function () { setVisible(document.visibilityState === "visible"); });
        window.addEventListener("online", function () { feed.setOnline(true); });
        window.addEventListener("offline", function () { feed.setOnline(false); });

        function showAdminPanel() {
          adminReturnFocus = document.activeElement;
          elAdminSymbol.value = settings.ticker;
          elAdminDebug.checked = settings.debug;
          elAdminBrightness.value = settings.brightness;
          elBrightnessValue.textContent = settings.brightness + "%";
          elAdminPanel.style.display = "flex"; elAdminSymbol.focus();
        }
        function hideAdminPanel() {
          elAdminPanel.style.display = "none";
          elContainer.style.setProperty("filter", "brightness(" + settings.brightness + "%)");
          if (adminReturnFocus) adminReturnFocus.focus();
        }
        document.getElementById("admin-save").addEventListener("click", function () {
          var ticker = elAdminSymbol.value.trim().toUpperCase();
          var brightness = Number(elAdminBrightness.value);
          if (!/^[A-Z0-9]{1,20}$/.test(ticker) || !Number.isFinite(brightness) || brightness < 10 || brightness > 100) {
            showToast("티커 및 밝기(10~100%)를 확인하세요."); return;
          }
          var changed = settings.ticker !== ticker;
          settings.ticker = ticker; settings.debug = elAdminDebug.checked; settings.brightness = brightness;
          var saved = persist(); hideAdminPanel();
          if (changed) applySelection();
          if (saved) showToast("설정이 저장되었습니다.");
        });
        document.getElementById("admin-close").addEventListener("click", hideAdminPanel);
        elStatus.addEventListener("click", showAdminPanel);
        elStatus.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); showAdminPanel(); }
        });
        elAdminBrightness.addEventListener("input", function () {
          elContainer.style.setProperty("filter", "brightness(" + elAdminBrightness.value + "%)");
          elBrightnessValue.textContent = elAdminBrightness.value + "%";
        });
        document.addEventListener("keydown", function (event) {
          if (elAdminPanel.style.display !== "flex") return;
          if (event.key === "Escape") hideAdminPanel();
          if (event.key === "Tab") {
            var focusable = elAdminPanel.querySelectorAll("input, button");
            var first = focusable[0], end = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); end.focus(); }
            else if (!event.shiftKey && document.activeElement === end) { event.preventDefault(); first.focus(); }
          }
        });
        function hideCursor() { document.body.style.cursor = document.fullscreenElement ? "none" : "auto"; }
        document.addEventListener("mousemove", function () {
          document.body.style.cursor = "auto"; clearTimeout(cursorTimer); cursorTimer = setTimeout(hideCursor, 2000);
        });
        document.addEventListener("fullscreenchange", hideCursor);

        if ("serviceWorker" in navigator) {
          var hadController = !!navigator.serviceWorker.controller;
          var updateButton = document.getElementById("app-update");
          updateButton.addEventListener("click", function () { window.location.reload(); });
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (hadController) updateButton.hidden = false;
            hadController = true;
          });
          navigator.serviceWorker.register("./service-worker.js", { updateViaCache: "none" }).then(function (registration) {
            function checkUpdate() { registration.update().catch(function (error) { console.warn("업데이트 확인 실패:", error); }); }
            checkUpdate();
            document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") checkUpdate(); });
          }).catch(function (error) { console.warn("Service Worker 등록 실패:", error); });
        }
      })();

    </script>
  </body>
</html>
